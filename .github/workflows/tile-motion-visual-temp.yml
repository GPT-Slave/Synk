name: temporary tile motion visual review

on:
  push:
    branches:
      - agent/strengthen-availability-tile-motion

jobs:
  visual-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start Synk web app
        run: |
          pnpm --filter web exec next dev --webpack --hostname 127.0.0.1 --port 3000 > /tmp/synk-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/visual-review/tile-motion >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/synk-web.log
          exit 1
      - name: Capture motion frames in Chromium
        run: |
          set -euo pipefail
          mkdir -p visual-artifacts
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          URL='http://127.0.0.1:3000/visual-review/tile-motion'

          capture() {
            local ms="$1"
            local name="$2"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
              --run-all-compositor-stages-before-draw --virtual-time-budget="$ms" \
              --window-size=390,844 \
              --screenshot="visual-artifacts/${name}.png" "$URL"
          }

          capture 900 before
          capture 1140 select-mid
          capture 1500 select-final
          capture 2080 deselect-mid
          capture 2450 deselect-final
      - uses: actions/upload-artifact@v4
        with:
          name: tile-motion-visual-review
          path: visual-artifacts
          if-no-files-found: error
