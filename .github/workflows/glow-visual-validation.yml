name: glow visual validation

on:
  push:
    branches:
      - agent/unified-selectable-heatmap

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      JWT_SECRET: glow-validation-access-secret-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: glow-validation-refresh-secret-abcdefghijklmnopqrstuvwxyz
      CSRF_SECRET: glow-validation-csrf-secret-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      BCRYPT_ROUNDS: "4"
      GLOBAL_RATE_LIMIT: "1000"
      GLOBAL_READ_RATE_LIMIT: "1000"
      GLOBAL_RATE_WINDOW_MS: "60000"
      TRUST_PROXY: "false"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-selectable-heatmap
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Keep glow outside tile interiors
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/meetings/interactive-availability-heatmap.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''  const glow =\n    "pointer-events-none absolute z-20 bg-emerald-300 shadow-[0_0_10px_2px_rgba(52,211,153,0.78)]";\n  return (\n    <>\n      <span className={`${glow} inset-x-0 top-0 h-[2px]`} />\n      <span className={`${glow} inset-x-0 bottom-0 h-[2px]`} />\n      {!hideLeft && <span className={`${glow} inset-y-0 left-0 w-[2px]`} />}\n      {!hideRight && <span className={`${glow} inset-y-0 right-0 w-[2px]`} />}\n    </>\n  );\n'''
          new = '''  const edge = "pointer-events-none absolute z-20 bg-emerald-300";\n  return (\n    <>\n      <span\n        className={`${edge} inset-x-0 top-0 h-[2px] shadow-[0_-5px_6px_rgba(52,211,153,0.72)]`}\n      />\n      <span\n        className={`${edge} inset-x-0 bottom-0 h-[2px] shadow-[0_5px_6px_rgba(52,211,153,0.72)]`}\n      />\n      {!hideLeft && (\n        <span\n          className={`${edge} inset-y-0 left-0 w-[2px] shadow-[-5px_0_6px_rgba(52,211,153,0.72)]`}\n        />\n      )}\n      {!hideRight && (\n        <span\n          className={`${edge} inset-y-0 right-0 w-[2px] shadow-[5px_0_6px_rgba(52,211,153,0.72)]`}\n        />\n      )}\n    </>\n  );\n'''
          if old not in s:
              raise SystemExit('FusedSelectionBoundary anchor not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: pnpm install --frozen-lockfile
      - name: Generate and migrate
        run: |
          pnpm prisma:generate
          pnpm --filter api run db:migrate:deploy
      - name: Static validation
        run: |
          node scripts/i18n-audit.mjs
          pnpm --filter web lint
          pnpm --filter web typecheck
          pnpm --filter api typecheck
      - name: Start app
        run: |
          PORT=4000 pnpm --filter api start > /tmp/synk-api.log 2>&1 &
          PORT=3000 pnpm --filter web exec next dev --webpack > /tmp/synk-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/ >/dev/null 2>&1 && curl -fsS http://localhost:3000/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/synk-api.log || true
          cat /tmp/synk-web.log || true
          exit 1
      - name: Install Chromium
        run: |
          mkdir -p /tmp/pw /tmp/glow-screenshot
          npm install --prefix /tmp/pw playwright@1.54.2
          node /tmp/pw/node_modules/playwright/cli.js install chromium
      - name: Capture real selected heatmap
        run: |
          cat > /tmp/glow-visual.cjs <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const base = 'http://localhost:3000';
          const api = 'http://localhost:4000';

          async function join(page, invite, name, times) {
            await page.goto(invite);
            await page.locator('#display-name').fill(name);
            await page.getByRole('button', { name: 'Continue to availability' }).click();
            const dialog = page.getByRole('dialog');
            await dialog.waitFor({ state: 'visible' });
            await dialog.getByRole('button', { name: 'Continue to availability' }).click();
            for (const time of times) {
              await page.locator(`button[title^="${time} ·"]`).first().click();
            }
            const save = page.getByRole('button', { name: 'Save now' });
            if (!(await save.isDisabled())) await save.click();
            await page.waitForTimeout(700);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const organizerContext = await browser.newContext({ viewport: { width: 1440, height: 1050 } });
            const page = await organizerContext.newPage();
            const password = 'VisualPass1!';
            await page.goto(`${base}/signup`);
            await page.locator('#email').fill(`glow-${Date.now()}@example.com`);
            await page.locator('#password').fill(password);
            await page.locator('#confirm-password').fill(password);
            await page.getByRole('button', { name: 'Create organizer account' }).click();
            await page.waitForURL('**/dashboard');
            const meeting = await page.evaluate(async ({ api }) => {
              const csrf = await (await fetch(`${api}/auth/csrf`, { credentials: 'include' })).json();
              const response = await fetch(`${api}/meetings`, {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf.token },
                body: JSON.stringify({
                  title: 'Glow visual validation', startDate: '2026-08-13', endDate: '2026-08-13',
                  workdayStart: '08:00', workdayEnd: '10:00', slotIntervalMinutes: 15,
                  meetingDurationMinutes: 30, timezone: 'Africa/Tunis'
                })
              });
              if (!response.ok) throw new Error(await response.text());
              return response.json();
            }, { api });
            const invite = `${base}/meets/${meeting.slug}`;
            const alice = await browser.newPage({ viewport: { width: 1000, height: 800 } });
            await join(alice, invite, 'Alice', ['08:00', '08:15']);
            const bob = await browser.newPage({ viewport: { width: 1000, height: 800 } });
            await join(bob, invite, 'Bob', ['08:00']);

            await page.goto(`${base}/dashboard/meetings/${meeting.id}`);
            const first = page.locator('button[title^="08:00 ·"]').first();
            const second = page.locator('button[title^="08:15 ·"]').first();
            await first.waitFor({ state: 'visible' });
            await first.click();
            await second.click();
            if ((await first.getAttribute('data-boundary-right')) !== 'false') throw new Error('fused boundary regressed');
            if ((await second.getAttribute('data-boundary-left')) !== 'false') throw new Error('fused boundary regressed');
            const bg = await first.evaluate((el) => getComputedStyle(el).backgroundColor);
            if (!bg || bg === 'rgba(0, 0, 0, 0)') throw new Error('heatmap blue background missing');
            await page.screenshot({ path: '/tmp/glow-screenshot/outward-green-glow.png', fullPage: true });
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node /tmp/glow-visual.cjs
      - name: Upload visual check
        uses: actions/upload-artifact@v4
        with:
          name: outward-green-glow
          path: /tmp/glow-screenshot/outward-green-glow.png
          if-no-files-found: error
      - name: Commit visual correction
        run: |
          rm .github/workflows/glow-visual-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "keep selection glow outside heatmap tiles"
          git push origin HEAD:agent/unified-selectable-heatmap
