name: temporary visual review

on:
  push:
    branches:
      - agent/fix-selected-tile-stripes-highlight

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start real Synk web app
        run: |
          pnpm --filter web exec next dev --webpack --hostname 127.0.0.1 --port 3000 > /tmp/synk-web.log 2>&1 &
          echo $! > /tmp/synk-web.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/__visual/availability >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/synk-web.log
          exit 1
      - name: Capture real Chromium renders
        run: |
          mkdir -p visual-artifacts
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not found"
            exit 1
          fi
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --run-all-compositor-stages-before-draw --window-size=390,844 \
            --screenshot=visual-artifacts/selected-t0.png \
            http://127.0.0.1:3000/__visual/availability
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --run-all-compositor-stages-before-draw --window-size=390,844 \
            --virtual-time-budget=5000 \
            --screenshot=visual-artifacts/selected-t5s.png \
            http://127.0.0.1:3000/__visual/availability
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --run-all-compositor-stages-before-draw --window-size=390,844 \
            --screenshot=visual-artifacts/match-highlight.png \
            'http://127.0.0.1:3000/__visual/availability?highlight=1'
      - uses: actions/upload-artifact@v4
        with:
          name: synk-visual-review
          path: visual-artifacts
          if-no-files-found: error
