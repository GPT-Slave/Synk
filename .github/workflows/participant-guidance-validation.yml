name: participant guidance validation

on:
  push:
    branches:
      - agent/participant-guidance-quarter-ui

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      PORT: "4000"
      JWT_SECRET: visual-test-access-secret-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: visual-test-refresh-secret-abcdefghijklmnopqrstuvwxyz
      CSRF_SECRET: visual-test-csrf-secret-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      BCRYPT_ROUNDS: "4"
      GLOBAL_RATE_LIMIT: "1000"
      GLOBAL_READ_RATE_LIMIT: "1000"
      GLOBAL_RATE_WINDOW_MS: "60000"
      TRUST_PROXY: "false"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/participant-guidance-quarter-ui
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply feature patch
        run: python3 scripts/apply-participant-guidance.py

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Apply database migrations
        run: pnpm --filter api run db:migrate:deploy

      - name: Participant service regression tests
        run: pnpm --filter api test -- participants/participants.service.spec.ts --runInBand

      - name: Translation regression audit
        run: node scripts/i18n-audit.mjs

      - name: Lint web
        run: pnpm --filter web lint

      - name: Lint api
        run: pnpm --filter api lint

      - name: Typecheck web
        run: pnpm --filter web typecheck

      - name: Typecheck api
        run: pnpm --filter api typecheck

      - name: Start API and web
        run: |
          pnpm --filter api start > /tmp/synk-api.log 2>&1 &
          pnpm --filter web exec next dev --webpack > /tmp/synk-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/ >/dev/null 2>&1 && curl -fsS http://localhost:3000 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "API log:"
          cat /tmp/synk-api.log || true
          echo "Web log:"
          cat /tmp/synk-web.log || true
          exit 1

      - name: Install browser validation runtime
        run: |
          mkdir -p /tmp/pw /tmp/synk-feature-screenshots
          npm install --prefix /tmp/pw playwright@1.54.2
          node /tmp/pw/node_modules/playwright/cli.js install chromium

      - name: Validate browser flows and capture screenshots
        run: |
          cat > /tmp/validate-synk-feature.cjs <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const fs = require('node:fs');

          const base = 'http://localhost:3000';
          const screens = '/tmp/synk-feature-screenshots';
          fs.mkdirSync(screens, { recursive: true });

          function overlap(a, b) {
            return !(a.x + a.width <= b.x || b.x + b.width <= a.x || a.y + a.height <= b.y || b.y + b.height <= a.y);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const organizer = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await organizer.newPage();
            const email = `visual-${Date.now()}@example.com`;
            const password = 'VisualPass1!';

            await page.goto(`${base}/signup`);
            await page.locator('#email').fill(email);
            await page.locator('#password').fill(password);
            await page.locator('#confirm-password').fill(password);
            await page.getByRole('button', { name: 'Create organizer account' }).click();
            await page.waitForURL('**/dashboard', { timeout: 20000 });

            await page.goto(`${base}/dashboard/meetings/new`);
            await page.locator('#title').fill('Participant guidance visual validation');
            await page.getByRole('button', { name: 'Create meeting' }).click();
            await page.waitForURL(/\/dashboard\/meetings\/[^/]+$/, { timeout: 20000 });
            const meetingId = page.url().split('/').pop();
            const meeting = await page.evaluate(async (id) => {
              const response = await fetch(`http://localhost:4000/meetings/${id}`, { credentials: 'include' });
              if (!response.ok) throw new Error(`meeting detail ${response.status}`);
              return response.json();
            }, meetingId);
            if (!meeting.slug) throw new Error('Meeting slug missing');
            const invite = `${base}/meets/${meeting.slug}`;

            const deviceOne = await browser.newContext({ viewport: { width: 1100, height: 900 } });
            const first = await deviceOne.newPage();
            await first.goto(invite);
            await first.locator('#display-name').fill('Alice');
            await first.getByRole('button', { name: 'Continue to availability' }).click();
            const guidance = first.getByRole('dialog');
            await guidance.waitFor({ state: 'visible', timeout: 15000 });
            await guidance.getByText('Each hour is split into four 15-minute quarters.').waitFor();
            await guidance.getByText('Use the same name on another device to reopen this availability.').waitFor();
            await first.screenshot({ path: `${screens}/participant-guidance-dialog.png`, fullPage: true });
            await guidance.getByRole('button', { name: 'Continue to availability' }).click();

            const fills = [];
            for (const [time, expected] of [['08:00','25%'], ['08:15','50%'], ['08:30','75%'], ['08:45','100%']]) {
              const cell = first.locator(`button[data-slot-start][title="${time}"]`).first();
              await cell.waitFor({ state: 'visible' });
              const actual = await cell.evaluate((element) => getComputedStyle(element).getPropertyValue('--synk-quarter-fill').trim());
              const pseudo = await cell.evaluate((element) => getComputedStyle(element, '::after').content);
              if (actual !== expected) throw new Error(`${time} quarter fill expected ${expected}, got ${actual}`);
              if (!pseudo || pseudo === 'none') throw new Error(`${time} quarter indicator pseudo-element missing`);
              fills.push(`${time}=${actual}`);
            }
            console.log(`Quarter indicators: ${fills.join(', ')}`);
            await first.screenshot({ path: `${screens}/quarter-indicators.png`, fullPage: true });

            await first.locator('button[data-slot-start][title="08:00"]').first().click();
            await Promise.all([
              first.waitForResponse((response) => response.url().includes('/availability') && response.request().method() === 'PUT' && response.ok(), { timeout: 15000 }),
              first.getByRole('button', { name: 'Save now' }).click(),
            ]);

            const deviceTwo = await browser.newContext({ viewport: { width: 1100, height: 900 } });
            const second = await deviceTwo.newPage();
            await second.goto(invite);
            await second.locator('#display-name').fill('alice');
            await second.getByRole('button', { name: 'Continue to availability' }).click();
            const secondGuidance = second.getByRole('dialog');
            await secondGuidance.waitFor({ state: 'visible', timeout: 15000 });
            await secondGuidance.getByRole('button', { name: 'Continue to availability' }).click();
            const restored = second.locator('button[data-slot-start][title="08:00"]').first();
            await restored.waitFor({ state: 'visible' });
            if ((await restored.getAttribute('aria-pressed')) !== 'true') {
              throw new Error('Second device did not restore Alice availability');
            }
            await second.screenshot({ path: `${screens}/same-name-second-device.png`, fullPage: true });

            await first.locator('button[data-slot-start][title="08:15"]').first().click();
            await Promise.all([
              first.waitForResponse((response) => response.url().includes('/availability') && response.request().method() === 'PUT' && response.ok(), { timeout: 15000 }),
              first.getByRole('button', { name: 'Save now' }).click(),
            ]);
            console.log('Original device session remained valid after same-name login on device two.');

            const arabic = await browser.newContext({ viewport: { width: 390, height: 844 } });
            await arabic.addInitScript(() => localStorage.setItem('synk:language', 'ar'));
            const rtl = await arabic.newPage();
            await rtl.goto(base);
            await rtl.waitForFunction(() => document.documentElement.dir === 'rtl');
            const theme = rtl.locator('button.fixed.bottom-4.left-4');
            const language = rtl.locator('label.fixed.bottom-4.right-4');
            await theme.waitFor({ state: 'visible' });
            await language.waitFor({ state: 'visible' });
            const themeBox = await theme.boundingBox();
            const languageBox = await language.boundingBox();
            if (!themeBox || !languageBox) throw new Error('Arabic floating controls missing');
            if (overlap(themeBox, languageBox)) throw new Error('Arabic theme and language controls overlap');
            if (!(themeBox.x < languageBox.x)) throw new Error('Theme control is not physically left of language control in RTL');
            await rtl.screenshot({ path: `${screens}/arabic-controls-mobile.png`, fullPage: true });
            console.log(`Arabic controls: theme x=${themeBox.x}, language x=${languageBox.x}`);

            await browser.close();
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          node /tmp/validate-synk-feature.cjs

      - name: Upload validation screenshots
        uses: actions/upload-artifact@v4
        with:
          name: participant-guidance-screenshots
          path: /tmp/synk-feature-screenshots/*.png
          if-no-files-found: error

      - name: Commit validated implementation
        run: |
          rm scripts/apply-participant-guidance.py
          rm .github/workflows/participant-guidance-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "add participant guidance and multi-device sessions"
          git push origin HEAD:agent/participant-guidance-quarter-ui
