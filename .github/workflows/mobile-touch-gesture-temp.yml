name: temporary mobile touch gesture review

on:
  push:
    branches:
      - agent/fix-mobile-horizontal-drag-selection

jobs:
  mobile-touch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser driver
        run: npm install --global playwright-core@1.55.0
      - name: Start Synk web app
        run: |
          pnpm --filter web exec next dev --webpack --hostname 127.0.0.1 --port 3000 > /tmp/synk-web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/visual-review/mobile-touch >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/synk-web.log
          exit 1
      - name: Exercise trusted touch gestures in Chromium
        env:
          NODE_PATH: /usr/local/lib/node_modules
        run: |
          set -euo pipefail
          export NODE_PATH="$(npm root -g)"
          mkdir -p visual-artifacts
          node <<'NODE'
          const { chromium } = require('playwright-core');

          const executablePath = process.env.CHROME_BIN || '/usr/bin/google-chrome';
          const url = 'http://127.0.0.1:3000/visual-review/mobile-touch';

          function assert(condition, message) {
            if (!condition) throw new Error(message);
          }

          async function main() {
            const browser = await chromium.launch({
              headless: true,
              executablePath,
              args: ['--no-sandbox', '--disable-gpu'],
            });
            const context = await browser.newContext({
              viewport: { width: 390, height: 844 },
              isMobile: true,
              hasTouch: true,
              deviceScaleFactor: 1,
            });
            const page = await context.newPage();
            const cdp = await context.newCDPSession(page);

            async function openFresh() {
              await page.goto(url, { waitUntil: 'networkidle' });
              await page.waitForSelector('button[data-heatmap-cell="true"]');
              await page.evaluate(() => window.scrollTo(0, 0));
            }

            async function selectedCount() {
              return Number(await page.locator('[data-test-selected-count="true"]').textContent());
            }

            async function touchPath(points, holdMs = 25) {
              const first = points[0];
              await cdp.send('Input.dispatchTouchEvent', {
                type: 'touchStart',
                touchPoints: [{ x: first.x, y: first.y, radiusX: 5, radiusY: 5 }],
              });
              for (const point of points.slice(1)) {
                await new Promise((resolve) => setTimeout(resolve, holdMs));
                await cdp.send('Input.dispatchTouchEvent', {
                  type: 'touchMove',
                  touchPoints: [{ x: point.x, y: point.y, radiusX: 5, radiusY: 5 }],
                });
              }
              await new Promise((resolve) => setTimeout(resolve, holdMs));
              await cdp.send('Input.dispatchTouchEvent', {
                type: 'touchEnd',
                touchPoints: [],
              });
              await page.waitForTimeout(120);
            }

            async function boxFor(locator) {
              await locator.scrollIntoViewIfNeeded();
              const box = await locator.boundingBox();
              assert(box, 'Expected a visible element bounding box');
              return box;
            }

            function center(box) {
              return { x: box.x + box.width / 2, y: box.y + box.height / 2 };
            }

            function line(start, end, steps = 18) {
              return Array.from({ length: steps + 1 }, (_, index) => {
                const ratio = index / steps;
                return {
                  x: start.x + (end.x - start.x) * ratio,
                  y: start.y + (end.y - start.y) * ratio,
                };
              });
            }

            // Tap remains the simplest single-tile interaction.
            await openFresh();
            let cells = page.locator('button[data-heatmap-cell="true"]');
            let firstBox = await boxFor(cells.nth(0));
            let firstCenter = center(firstBox);
            await page.touchscreen.tap(firstCenter.x, firstCenter.y);
            await page.waitForTimeout(120);
            assert((await selectedCount()) === 1, 'Tap should select exactly one tile');
            await page.touchscreen.tap(firstCenter.x, firstCenter.y);
            await page.waitForTimeout(120);
            assert((await selectedCount()) === 0, 'Second tap should deselect the tile');

            // Horizontal left-to-right sweep selects all four quarters in the row.
            await openFresh();
            cells = page.locator('button[data-heatmap-cell="true"]');
            firstBox = await boxFor(cells.nth(0));
            const fourthBox = await boxFor(cells.nth(3));
            firstCenter = center(firstBox);
            const fourthCenter = center(fourthBox);
            const horizontalScrollBefore = await page.evaluate(() => window.scrollY);
            await touchPath(line(firstCenter, fourthCenter));
            assert((await selectedCount()) === 4, 'Left-to-right tile sweep should select four quarters');
            const horizontalScrollAfter = await page.evaluate(() => window.scrollY);
            assert(Math.abs(horizontalScrollAfter - horizontalScrollBefore) < 8, 'Horizontal tile sweep must not vertically scroll the page');
            await page.screenshot({ path: 'visual-artifacts/horizontal-selected.png', fullPage: false });

            // Right-to-left works identically.
            await openFresh();
            cells = page.locator('button[data-heatmap-cell="true"]');
            firstBox = await boxFor(cells.nth(0));
            const lastBox = await boxFor(cells.nth(3));
            await touchPath(line(center(lastBox), center(firstBox)));
            assert((await selectedCount()) === 4, 'Right-to-left tile sweep should select four quarters');

            // A vertical swipe that begins on a tile must scroll, not select.
            await openFresh();
            cells = page.locator('button[data-heatmap-cell="true"]');
            const verticalTarget = cells.nth(12);
            const verticalBox = await boxFor(verticalTarget);
            const verticalStart = center(verticalBox);
            const scrollBefore = await page.evaluate(() => window.scrollY);
            await touchPath(line(verticalStart, { x: verticalStart.x, y: verticalStart.y - 190 }, 12), 18);
            const scrollAfter = await page.evaluate(() => window.scrollY);
            assert(scrollAfter > scrollBefore + 45, `Vertical tile swipe should scroll the page (before=${scrollBefore}, after=${scrollAfter})`);
            assert((await selectedCount()) === 0, 'Vertical scrolling over tiles must not select availability');
            await page.screenshot({ path: 'visual-artifacts/vertical-scroll.png', fullPage: false });

            // A vertical-dominant diagonal swipe is also treated as scrolling.
            await openFresh();
            cells = page.locator('button[data-heatmap-cell="true"]');
            const diagonalBox = await boxFor(cells.nth(12));
            const diagonalStart = center(diagonalBox);
            const diagonalScrollBefore = await page.evaluate(() => window.scrollY);
            await touchPath(line(diagonalStart, { x: diagonalStart.x + 34, y: diagonalStart.y - 190 }, 12), 18);
            const diagonalScrollAfter = await page.evaluate(() => window.scrollY);
            assert(diagonalScrollAfter > diagonalScrollBefore + 45, 'Vertical-dominant diagonal gesture should remain page scroll');
            assert((await selectedCount()) === 0, 'Vertical-dominant diagonal scroll must not select tiles');

            // Long press inspection still works because the fix does not steal pointer-down.
            await openFresh();
            cells = page.locator('button[data-heatmap-cell="true"]');
            firstBox = await boxFor(cells.nth(0));
            firstCenter = center(firstBox);
            await cdp.send('Input.dispatchTouchEvent', {
              type: 'touchStart',
              touchPoints: [{ x: firstCenter.x, y: firstCenter.y, radiusX: 5, radiusY: 5 }],
            });
            await page.waitForTimeout(520);
            assert(await page.locator('[data-heatmap-tooltip="true"]').isVisible(), 'Long-press participant inspection should still appear');
            await cdp.send('Input.dispatchTouchEvent', { type: 'touchEnd', touchPoints: [] });

            // The dedicated day navigator keeps its independent horizontal swipe behavior.
            await openFresh();
            const dayGrid = page.locator('[data-mobile-day-index]');
            assert((await dayGrid.getAttribute('data-mobile-day-index')) === '0', 'Expected to start on day zero');
            const dayTrack = page.locator('[data-day-swipe-track="true"]');
            const dayBox = await boxFor(dayTrack);
            const dayY = dayBox.y + dayBox.height / 2;
            await touchPath(line(
              { x: dayBox.x + dayBox.width * 0.78, y: dayY },
              { x: dayBox.x + dayBox.width * 0.22, y: dayY },
              14,
            ), 22);
            await page.waitForFunction(() => document.querySelector('[data-mobile-day-index]')?.getAttribute('data-mobile-day-index') === '1');
            assert((await dayGrid.getAttribute('data-mobile-day-index')) === '1', 'Day swipe strip should advance to the next day');

            console.log('PASS tap toggle');
            console.log('PASS horizontal sweep left-to-right');
            console.log('PASS horizontal sweep right-to-left');
            console.log('PASS vertical scroll does not select');
            console.log('PASS diagonal vertical scroll does not select');
            console.log('PASS long press inspection');
            console.log('PASS dedicated day swipe navigation');
            await browser.close();
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-touch-gesture-review
          path: visual-artifacts
          if-no-files-found: ignore
