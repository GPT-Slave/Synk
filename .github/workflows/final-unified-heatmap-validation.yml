name: final unified heatmap validation

on:
  push:
    branches:
      - agent/unified-selectable-heatmap

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetplanner
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d meetplanner"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      JWT_SECRET: final-heatmap-access-secret-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: final-heatmap-refresh-secret-abcdefghijklmnopqrstuvwxyz
      CSRF_SECRET: final-heatmap-csrf-secret-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      BCRYPT_ROUNDS: "4"
      GLOBAL_RATE_LIMIT: "1000"
      GLOBAL_READ_RATE_LIMIT: "1000"
      GLOBAL_RATE_WINDOW_MS: "60000"
      TRUST_PROXY: "false"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/unified-selectable-heatmap
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Stabilize tile renderer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/meetings/interactive-availability-heatmap.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('import { motion, useReducedMotion } from "framer-motion";\n', '')
          s = s.replace('  const reduceMotion = useReducedMotion();\n', '')
          s = s.replace('              onKeyboardActivate={keyboardActivate}\n', '')
          s = s.replace('              reduceMotion={Boolean(reduceMotion)}\n', '')
          s = s.replace('  onKeyboardActivate,\n', '')
          s = s.replace('  onKeyboardActivate: (cell: HeatmapCellDto) => void;\n', '')
          s = s.replace('  reduceMotion,\n', '')
          s = s.replace('  reduceMotion: boolean;\n', '')
          s = s.replace('outline-none transition duration-150 focus-visible', 'outline-none transition-transform duration-150 focus-visible')
          s = s.replace('<motion.button', '<button')
          s = s.replace('</motion.button>', '</button>')
          s = s.replace('                  whileHover={reduceMotion || isMobile ? undefined : { scale: 1.018 }}\n', '')
          s = s.replace('                  whileTap={reduceMotion ? undefined : { scale: 0.97 }}\n', '')
          start = s.index('function heatmapColor(percentage: number): CSSProperties {')
          end = s.index('function useMobileLayout()', start)
          block = '''function heatmapColor(percentage: number): CSSProperties {\n  const normalized = Math.max(0, Math.min(100, percentage)) / 100;\n  const start = { r: 6, g: 16, b: 28 };\n  const end = { r: 0, g: 148, b: 255 };\n  const mix = (from: number, to: number) =>\n    Math.round(from + (to - from) * normalized);\n  const red = mix(start.r, end.r);\n  const green = mix(start.g, end.g);\n  const blue = mix(start.b, end.b);\n  return {\n    backgroundColor: `rgb(${red} ${green} ${blue})`,\n    borderColor: `rgba(96, 165, 250, ${(0.12 + normalized * 0.58).toFixed(3)})`,\n    boxShadow: `inset 0 0 ${Math.round(8 + normalized * 18)}px rgba(56, 189, 248, ${(normalized * 0.22).toFixed(3)})`,\n    color: normalized >= 0.48 ? "rgb(248 250 252)" : "rgb(186 230 253)",\n  };\n}\n\n'''
          s = s[:start] + block + s[end:]
          boundary_start = s.index('function FusedSelectionBoundary({')
          boundary_end = s.index('function DaySwipeNavigator({', boundary_start)
          boundary = '''function FusedSelectionBoundary({\n  hideLeft,\n  hideRight,\n}: {\n  hideLeft: boolean;\n  hideRight: boolean;\n}) {\n  const line: CSSProperties = {\n    position: "absolute",\n    pointerEvents: "none",\n    zIndex: 20,\n    backgroundColor: "rgb(110 231 183)",\n  };\n  const halo: CSSProperties = {\n    position: "absolute",\n    pointerEvents: "none",\n    zIndex: 19,\n  };\n  return (\n    <>\n      <span style={{ ...line, left: 0, right: 0, top: -2, height: 2 }} />\n      <span\n        style={{\n          ...halo, left: 0, right: 0, top: -10, height: 8,\n          background: "linear-gradient(to top, rgba(52,211,153,0.55), rgba(52,211,153,0))",\n        }}\n      />\n      <span style={{ ...line, left: 0, right: 0, bottom: -2, height: 2 }} />\n      <span\n        style={{\n          ...halo, left: 0, right: 0, bottom: -10, height: 8,\n          background: "linear-gradient(to bottom, rgba(52,211,153,0.55), rgba(52,211,153,0))",\n        }}\n      />\n      {!hideLeft && (\n        <>\n          <span style={{ ...line, top: 0, bottom: 0, left: -2, width: 2 }} />\n          <span\n            style={{\n              ...halo, top: 0, bottom: 0, left: -10, width: 8,\n              background: "linear-gradient(to left, rgba(52,211,153,0), rgba(52,211,153,0.55))",\n            }}\n          />\n        </>\n      )}\n      {!hideRight && (\n        <>\n          <span style={{ ...line, top: 0, bottom: 0, right: -2, width: 2 }} />\n          <span\n            style={{\n              ...halo, top: 0, bottom: 0, right: -10, width: 8,\n              background: "linear-gradient(to right, rgba(52,211,153,0.55), rgba(52,211,153,0))",\n            }}\n          />\n        </>\n      )}\n    </>\n  );\n}\n\n'''
          s = s[:boundary_start] + boundary + s[boundary_end:]
          assert 'motion.button' not in s
          assert 'useReducedMotion' not in s
          assert 'onKeyboardActivate:' not in s
          assert 'shadow-[' not in s[s.index('function FusedSelectionBoundary({'):s.index('function DaySwipeNavigator({')]
          p.write_text(s, encoding='utf-8')
          PY
      - run: pnpm install --frozen-lockfile
      - name: Generate and migrate
        run: |
          pnpm prisma:generate
          pnpm --filter api run db:migrate:deploy
      - name: Static validation
        run: |
          node scripts/i18n-audit.mjs
          pnpm --filter web lint
          pnpm --filter web typecheck
          pnpm --filter api typecheck
      - name: Start app
        run: |
          PORT=4000 pnpm --filter api start >/tmp/api.log 2>&1 &
          PORT=3000 pnpm --filter web exec next dev --webpack >/tmp/web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/ >/dev/null 2>&1 && curl -fsS http://localhost:3000/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/api.log || true
          cat /tmp/web.log || true
          exit 1
      - name: Install Chromium and PNG reader
        run: |
          mkdir -p /tmp/pw /tmp/final-heatmap
          npm install --prefix /tmp/pw playwright@1.54.2 pngjs@7.0.0
          node /tmp/pw/node_modules/playwright/cli.js install chromium
      - name: Browser validation
        run: |
          cat >/tmp/final-heatmap.cjs <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const { PNG } = require('/tmp/pw/node_modules/pngjs');
          const fs = require('node:fs');
          const base = 'http://localhost:3000';
          const api = 'http://localhost:4000';
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const ctx = await browser.newContext({ viewport: { width: 1440, height: 1000 } });
            const page = await ctx.newPage();
            const password = 'VisualPass1!';
            await page.goto(`${base}/signup`);
            await page.locator('#email').fill(`final-heatmap-${Date.now()}@example.com`);
            await page.locator('#password').fill(password);
            await page.locator('#confirm-password').fill(password);
            await page.getByRole('button', { name: 'Create organizer account' }).click();
            await page.waitForURL('**/dashboard');
            const meeting = await page.evaluate(async ({ api }) => {
              const csrf = await (await fetch(`${api}/auth/csrf`, { credentials: 'include' })).json();
              const r = await fetch(`${api}/meetings`, {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf.token },
                body: JSON.stringify({ title:'Final unified heatmap', startDate:'2026-08-13', endDate:'2026-08-14', workdayStart:'08:00', workdayEnd:'10:00', slotIntervalMinutes:15, meetingDurationMinutes:30, timezone:'Africa/Tunis' })
              });
              if (!r.ok) throw new Error(await r.text());
              return r.json();
            }, { api });
            await page.goto(`${base}/dashboard/meetings/${meeting.id}`);
            const a = page.locator('button[title^="08:00 ·"]').first();
            const b = page.locator('button[title^="08:15 ·"]').first();
            const c = page.locator('button[title^="08:30 ·"]').first();
            await a.waitFor({ state: 'visible' });
            await a.click();
            await b.click();
            if ((await a.getAttribute('data-selected')) !== 'true' || (await b.getAttribute('data-selected')) !== 'true') throw new Error('selection did not apply');
            if ((await a.getAttribute('data-boundary-right')) !== 'false' || (await b.getAttribute('data-boundary-left')) !== 'false') throw new Error('adjacent fused edge regression');
            const colors = await a.evaluate((el) => ({ inline: el.style.backgroundColor, computed: getComputedStyle(el).backgroundColor }));
            console.log('Selected tile colors:', JSON.stringify(colors));
            if (!colors.inline.includes('148') || !colors.inline.includes('255')) throw new Error(`selected tile did not receive explicit blue background: ${colors.inline}`);
            await c.click();
            await page.waitForFunction(() => {
              const el = [...document.querySelectorAll('button[data-slot-start]')].find((node) => node.getAttribute('title')?.startsWith('08:30 ·'));
              return el?.getAttribute('title')?.includes('1/1');
            });
            await a.hover();
            await page.locator('[data-heatmap-tooltip="true"]').waitFor({ state: 'visible' });
            const tileShot = '/tmp/final-heatmap/selected-tile.png';
            await a.screenshot({ path: tileShot });
            const png = PNG.sync.read(fs.readFileSync(tileShot));
            const probes = [[0.40,0.72],[0.55,0.72],[0.65,0.82]];
            let blueCount = 0;
            const values = [];
            for (const [px, py] of probes) {
              const x = Math.max(0, Math.min(png.width - 1, Math.round(png.width * px)));
              const y = Math.max(0, Math.min(png.height - 1, Math.round(png.height * py)));
              const i = (png.width * y + x) * 4;
              const rgb = [png.data[i], png.data[i + 1], png.data[i + 2]];
              values.push(rgb.join(','));
              if (rgb[2] > rgb[1] && rgb[1] > rgb[0]) blueCount += 1;
            }
            console.log('Selected tile pixels:', values.join(' | '));
            if (blueCount < 2) throw new Error(`selected tile interior is not blue-dominant: ${values.join(' | ')}`);
            await page.screenshot({ path: '/tmp/final-heatmap/desktop-unified-heatmap.png', fullPage: true });
            await page.setViewportSize({ width: 390, height: 844 });
            await page.waitForTimeout(250);
            const headers = page.locator('[data-date-header]');
            if (await headers.count() !== 1) throw new Error(`mobile must show one day, got ${await headers.count()}`);
            await page.locator('[data-day-swipe="true"]').waitFor({ state: 'visible' });
            await page.getByTitle('View').click();
            const mobileCell = page.locator('button[data-slot-start]').first();
            await mobileCell.click();
            await page.locator('[data-heatmap-tooltip="true"]').waitFor({ state: 'visible' });
            await page.screenshot({ path: '/tmp/final-heatmap/mobile-view-mode.png', fullPage: true });
            await browser.close();
          })().catch((e) => { console.error(e); process.exit(1); });
          NODE
          node /tmp/final-heatmap.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: final-unified-heatmap-screenshots
          path: /tmp/final-heatmap/*.png
          if-no-files-found: error
      - name: Commit validated product code
        run: |
          rm .github/workflows/final-unified-heatmap-validation.yml
          rm -f i18n-audit-output.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "stabilize unified selectable heatmap rendering"
          git push origin HEAD:agent/unified-selectable-heatmap
