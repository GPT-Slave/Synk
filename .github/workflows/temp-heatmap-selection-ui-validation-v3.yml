name: Temporary heatmap selection UI validation v3

on:
  push:
    branches: [agent/validate-heatmap-selection-ui-v3]

jobs:
  visual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api exec prisma generate
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - name: Build production web
        env:
          VERCEL_GIT_COMMIT_SHA: 1234567890abcdef1234567890abcdef12345678
          NEXT_PUBLIC_API_URL: https://synk-fueq.onrender.com
          NEXT_PUBLIC_WS_URL: https://synk-fueq.onrender.com
        run: pnpm --filter web build
      - name: Run browser fixture
        run: |
          PORT=3000 pnpm --filter web start >/tmp/heatmap-ui-web.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$WEB_PID" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -fsS http://localhost:3000/ >/dev/null 2>&1; then break; fi
            if [ "$i" -eq 60 ]; then cat /tmp/heatmap-ui-web.log; exit 1; fi
            sleep 1
          done
          mkdir -p /tmp/pw /tmp/heatmap-ui
          npm install --prefix /tmp/pw playwright@1.54.2
          node /tmp/pw/node_modules/playwright/cli.js install chromium
          node scripts/temp-heatmap-selection-ui-regression.cjs
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heatmap-selection-ui-v3-screenshots
          path: /tmp/heatmap-ui/*.png
          if-no-files-found: warn
