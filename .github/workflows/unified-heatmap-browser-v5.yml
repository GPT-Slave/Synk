name: unified heatmap browser v5

on:
  push:
    branches:
      - agent/participant-guidance-quarter-ui

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      JWT_SECRET: unified-v5-access-secret-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: unified-v5-refresh-secret-abcdefghijklmnopqrstuvwxyz
      CSRF_SECRET: unified-v5-csrf-secret-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      BCRYPT_ROUNDS: "4"
      GLOBAL_RATE_LIMIT: "1000"
      GLOBAL_READ_RATE_LIMIT: "1000"
      GLOBAL_RATE_WINDOW_MS: "60000"
      TRUST_PROXY: "false"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/participant-guidance-quarter-ui
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Apply feature implementation
        run: |
          python3 scripts/apply-unified-selectable-heatmap.py
          python3 scripts/apply-guidance-once-fix.py
          python3 scripts/apply-day-swipe-fix.py
          python3 scripts/apply-scroll-contract-validation.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/meetings/interactive-availability-heatmap.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const touchedSlot = useRef<string>();', 'const touchedSlot = useRef<string | undefined>(undefined);')
          s = s.replace('const touchGesture = useRef<TouchGesture>();', 'const touchGesture = useRef<TouchGesture | undefined>(undefined);')
          s = s.replace('const gesture = useRef<{ pointerId: number; x: number }>();', 'const gesture = useRef<{ pointerId: number; x: number } | undefined>(undefined);')
          s = s.replace('.map((hour, hourIndex) => (', '.map((hour) => (')
          s = s.replace('              hourIndex={hourIndex}\n              hours={hours}\n', '')
          s = s.replace('  hourIndex,\n  hours,\n', '')
          s = s.replace('  hourIndex: number;\n  hours: string[];\n', '')
          s = s.replace('  useEffect(() => {\n    setActiveDateIndex((current) =>\n      Math.max(0, Math.min(current, meeting.dates.length - 1)),\n    );\n  }, [meeting.dates.length]);\n\n', '')
          s = s.replace('        Math.abs(deltaX) > Math.abs(deltaY) &&\n        Math.abs(deltaX) >= TOUCH_DRAG_THRESHOLD', '        distance >= TOUCH_DRAG_THRESHOLD')
          p.write_text(s, encoding='utf-8')
          p = Path('apps/web/src/components/meetings/best-time-suggestions.tsx')
          s = p.read_text(encoding='utf-8').replace('const holdTimer = useRef<number>();', 'const holdTimer = useRef<number | undefined>(undefined);')
          p.write_text(s, encoding='utf-8')
          p = Path('apps/api/src/meetings/meetings.service.spec.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace("  const realtime = {\n    availabilityChanged: jest.fn(),", "  const realtime = {\n    availabilityChanged: jest.fn(),\n    meetingUpdated: jest.fn(),")
          s = s.replace("\n\n\n  it('exposes the same heatmap", "\n\n  it('exposes the same heatmap")
          p.write_text(s, encoding='utf-8')
          PY
      - run: pnpm install --frozen-lockfile
      - name: Generate and migrate
        run: |
          pnpm prisma:generate
          pnpm --filter api run db:migrate:deploy
      - name: Regression suites
        run: pnpm --filter api test -- meetings/availability-aggregation.spec.ts meetings/meetings.service.spec.ts participants/participants.service.spec.ts --runInBand
      - name: Translation audit
        run: node scripts/i18n-audit.mjs
      - name: Web lint
        run: pnpm --filter web lint
      - name: Lint changed API files
        run: |
          pnpm --filter api exec eslint --fix src/meetings/availability-aggregation.ts src/meetings/meetings.service.ts src/meetings/meetings.service.spec.ts src/app.service.ts
          pnpm --filter api exec eslint src/meetings/availability-aggregation.ts src/meetings/meetings.service.ts src/meetings/meetings.service.spec.ts src/app.service.ts
      - name: Typecheck
        run: |
          pnpm --filter web typecheck
          pnpm --filter api typecheck
      - name: Start app
        run: |
          PORT=4000 pnpm --filter api start > /tmp/synk-api.log 2>&1 &
          PORT=3000 pnpm --filter web exec next dev --webpack > /tmp/synk-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/ >/dev/null 2>&1 && curl -fsS http://localhost:3000/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/synk-api.log || true
          cat /tmp/synk-web.log || true
          exit 1
      - name: Install Chromium
        run: |
          mkdir -p /tmp/pw /tmp/unified-heatmap-screenshots
          npm install --prefix /tmp/pw playwright@1.54.2
          node /tmp/pw/node_modules/playwright/cli.js install chromium
      - name: Browser validation
        run: node scripts/validate-unified-heatmap.cjs
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: unified-heatmap-screenshots
          path: /tmp/unified-heatmap-screenshots/*.png
          if-no-files-found: error
      - name: Commit validated implementation
        run: |
          rm -f scripts/apply-unified-selectable-heatmap.py scripts/apply-guidance-once-fix.py scripts/apply-day-swipe-fix.py scripts/apply-scroll-contract-validation.py scripts/validate-unified-heatmap.cjs
          rm -f .github/workflows/unified-heatmap-validation.yml .github/workflows/unified-heatmap-static-v2.yml .github/workflows/unified-heatmap-static-v3.yml .github/workflows/unified-heatmap-browser-v4.yml .github/workflows/unified-heatmap-browser-v5.yml
          rm -f apps/web/src/components/meetings/heatmap-grid.tsx i18n-audit-output.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unify availability selection with live heatmap"
          git push origin HEAD:agent/participant-guidance-quarter-ui
