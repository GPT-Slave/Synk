name: unified heatmap validation

on:
  push:
    branches:
      - agent/participant-guidance-quarter-ui

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      JWT_SECRET: unified-heatmap-access-secret-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: unified-heatmap-refresh-secret-abcdefghijklmnopqrstuvwxyz
      CSRF_SECRET: unified-heatmap-csrf-secret-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      BCRYPT_ROUNDS: "4"
      GLOBAL_RATE_LIMIT: "1000"
      GLOBAL_READ_RATE_LIMIT: "1000"
      GLOBAL_RATE_WINDOW_MS: "60000"
      TRUST_PROXY: "false"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/participant-guidance-quarter-ui
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply unified heatmap patch
        run: |
          python3 scripts/apply-unified-selectable-heatmap.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/meetings/interactive-availability-heatmap.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('const touchedSlot = useRef<string>();', 'const touchedSlot = useRef<string | undefined>(undefined);')
          s = s.replace('const touchGesture = useRef<TouchGesture>();', 'const touchGesture = useRef<TouchGesture | undefined>(undefined);')
          s = s.replace('const gesture = useRef<{ pointerId: number; x: number }>();', 'const gesture = useRef<{ pointerId: number; x: number } | undefined>(undefined);')
          s = s.replace('.map((hour, hourIndex) => (', '.map((hour) => (')
          s = s.replace('              hourIndex={hourIndex}\n              hours={hours}\n', '')
          s = s.replace('  hourIndex,\n  hours,\n', '')
          s = s.replace('  hourIndex: number;\n  hours: string[];\n', '')
          p.write_text(s, encoding='utf-8')
          p = Path('apps/web/src/components/meetings/best-time-suggestions.tsx')
          s = p.read_text(encoding='utf-8').replace('const holdTimer = useRef<number>();', 'const holdTimer = useRef<number | undefined>(undefined);')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client and migrate
        run: |
          pnpm prisma:generate
          pnpm --filter api run db:migrate:deploy

      - name: Regression tests
        run: |
          pnpm --filter api test -- meetings/availability-aggregation.spec.ts meetings/meetings.service.spec.ts participants/participants.service.spec.ts --runInBand
          node scripts/i18n-audit.mjs
          pnpm --filter web lint
          pnpm --filter api exec eslint "{src,apps,libs,test}/**/*.ts"
          pnpm --filter web typecheck
          pnpm --filter api typecheck

      - name: Start API and web
        run: |
          PORT=4000 pnpm --filter api start > /tmp/synk-api.log 2>&1 &
          PORT=3000 pnpm --filter web exec next dev --webpack > /tmp/synk-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/ >/dev/null 2>&1 && curl -fsS http://localhost:3000/ >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          echo "API log:"; cat /tmp/synk-api.log || true
          echo "Web log:"; cat /tmp/synk-web.log || true
          exit 1

      - name: Install browser runtime
        run: |
          mkdir -p /tmp/pw /tmp/unified-heatmap-screenshots
          npm install --prefix /tmp/pw playwright@1.54.2
          node /tmp/pw/node_modules/playwright/cli.js install chromium

      - name: Validate unified heatmap flows
        run: |
          cat > /tmp/validate-unified-heatmap.cjs <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const fs = require('node:fs');
          const base = 'http://localhost:3000';
          const api = 'http://localhost:4000';
          const screens = '/tmp/unified-heatmap-screenshots';
          fs.mkdirSync(screens, { recursive: true });

          async function join(page, invite, name) {
            await page.goto(invite);
            await page.locator('#display-name').fill(name);
            await page.getByRole('button', { name: 'Continue to availability' }).click();
            const dialog = page.getByRole('dialog');
            await dialog.waitFor({ state: 'visible', timeout: 15000 });
            await dialog.getByRole('button', { name: 'Continue to availability' }).click();
            await page.locator('[data-unified-heatmap="true"]').waitFor();
          }

          async function clickSlot(page, time) {
            const cell = page.locator(`button[title^="${time} ·"]`).first();
            await cell.click();
            return cell;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const organizerContext = await browser.newContext({ viewport: { width: 1440, height: 1100 } });
            const organizer = await organizerContext.newPage();
            const email = `heatmap-${Date.now()}@example.com`;
            const password = 'VisualPass1!';

            await organizer.goto(`${base}/signup`);
            await organizer.locator('#email').fill(email);
            await organizer.locator('#password').fill(password);
            await organizer.locator('#confirm-password').fill(password);
            await organizer.getByRole('button', { name: 'Create organizer account' }).click();
            await organizer.waitForURL('**/dashboard', { timeout: 20000 });

            const meeting = await organizer.evaluate(async ({ api }) => {
              const csrfResponse = await fetch(`${api}/auth/csrf`, { credentials: 'include' });
              const { token } = await csrfResponse.json();
              const response = await fetch(`${api}/meetings`, {
                method: 'POST',
                credentials: 'include',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': token },
                body: JSON.stringify({
                  title: 'Unified heatmap validation',
                  description: 'Browser validation',
                  startDate: '2026-08-13',
                  endDate: '2026-08-14',
                  workdayStart: '08:00',
                  workdayEnd: '10:00',
                  slotIntervalMinutes: 15,
                  meetingDurationMinutes: 30,
                  timezone: 'Africa/Tunis',
                }),
              });
              if (!response.ok) throw new Error(`create meeting ${response.status}: ${await response.text()}`);
              return response.json();
            }, { api });
            const invite = `${base}/meets/${meeting.slug}`;

            const aliceContext = await browser.newContext({ viewport: { width: 1100, height: 900 } });
            const alice = await aliceContext.newPage();
            await join(alice, invite, 'Alice');
            await clickSlot(alice, '08:00');
            await clickSlot(alice, '08:15');
            await alice.getByRole('button', { name: 'Save now' }).click();
            await alice.waitForTimeout(900);

            const bobContext = await browser.newContext({ viewport: { width: 1100, height: 900 } });
            const bob = await bobContext.newPage();
            await join(bob, invite, 'Bob');
            await clickSlot(bob, '08:00');
            await bob.getByRole('button', { name: 'Save now' }).click();
            await bob.waitForTimeout(900);

            await organizer.goto(`${base}/dashboard/meetings/${meeting.id}`);
            await organizer.locator('[data-unified-heatmap="true"]').waitFor({ timeout: 20000 });
            if (await organizer.locator('[data-unified-heatmap="true"]').count() !== 1) {
              throw new Error('Organizer does not render exactly one unified heatmap');
            }
            const org0800 = organizer.locator('button[title^="08:00 ·"]').first();
            const org0815 = organizer.locator('button[title^="08:15 ·"]').first();
            const before = (await org0800.textContent()).trim();
            if (before !== '2/3') throw new Error(`Expected optimistic denominator 2/3 before organizer edit, got ${before}`);
            await org0800.click();
            const immediate = (await org0800.textContent()).trim();
            if (immediate !== '3/3') throw new Error(`Optimistic heatmap did not update immediately: ${immediate}`);
            if ((await org0800.getAttribute('data-selected')) !== 'true') throw new Error('Organizer selected tile missing selected state');
            if ((await org0800.getAttribute('data-boundary-right')) !== 'true') throw new Error('Single selection should expose right green boundary');
            await org0815.click();
            if ((await org0800.getAttribute('data-boundary-right')) !== 'false') throw new Error('Adjacent selected tiles retained shared right edge');
            if ((await org0815.getAttribute('data-boundary-left')) !== 'false') throw new Error('Adjacent selected tiles retained shared left edge');

            await org0800.hover();
            await organizer.waitForTimeout(150);
            const highlightedRoster = organizer.locator('[data-participant-id][data-highlighted="true"]');
            if (await highlightedRoster.count() < 2) throw new Error('Hovering heatmap did not highlight available participant names');
            await organizer.screenshot({ path: `${screens}/organizer-unified-heatmap.png`, fullPage: true });

            const firstMatch = organizer.locator('[data-match-start]').first();
            await firstMatch.hover();
            await organizer.locator('[data-match-participant-names="true"]').waitFor({ state: 'visible' });
            if ((await organizer.locator('[data-match-participant-names="true"]').textContent()).trim().length < 3) {
              throw new Error('Best match hover did not show participant names');
            }
            if (await organizer.locator('[data-participant-id][data-highlighted="true"]').count() < 1) {
              throw new Error('Best match hover did not highlight participant list');
            }
            await organizer.screenshot({ path: `${screens}/best-match-hover-names.png`, fullPage: true });

            await alice.reload();
            await alice.locator('[data-unified-heatmap="true"]').waitFor();
            if (await alice.locator('[data-participant-roster="true"]').count() !== 1) throw new Error('Participant does not see shared heatmap participant roster');
            const aliceCell = alice.locator('button[title^="08:30 ·"]').first();
            const aliceBefore = (await aliceCell.textContent()).trim();
            await aliceCell.click();
            const aliceAfter = (await aliceCell.textContent()).trim();
            if (aliceBefore === aliceAfter) throw new Error('Participant heatmap did not optimistically update before DB save');
            await alice.locator('button[title^="08:00 ·"]').first().hover();
            if (await alice.locator('[data-participant-roster] [data-highlighted="true"]').count() < 1) throw new Error('Participant desktop hover did not light roster names');
            await alice.screenshot({ path: `${screens}/participant-unified-heatmap.png`, fullPage: true });

            const mobileContext = await browser.newContext({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
            const mobile = await mobileContext.newPage();
            await mobile.goto(invite);
            await mobile.locator('#display-name').fill('Alice');
            await mobile.getByRole('button', { name: 'Continue to availability' }).click();
            const mobileDialog = mobile.getByRole('dialog');
            await mobileDialog.waitFor({ state: 'visible' });
            await mobileDialog.getByRole('button', { name: 'Continue to availability' }).click();
            const mobileGrid = mobile.locator('[data-unified-heatmap="true"]');
            await mobileGrid.waitFor();
            if (await mobile.locator('[data-date-header]').count() !== 1) throw new Error('Mobile heatmap renders more than one day');
            const editButton = mobile.locator('button[title="Edit"]');
            const viewButton = mobile.locator('button[title="View"]');
            if ((await editButton.getAttribute('aria-pressed')) !== 'true') throw new Error('Mobile did not default to edit mode');
            if ((await mobile.locator('[data-day-swipe="true"]').count()) !== 1) throw new Error('Dedicated mobile day swipe area missing');
            await mobile.screenshot({ path: `${screens}/mobile-edit-one-day.png`, fullPage: true });

            const swipeArea = mobile.locator('[data-day-swipe="true"] > div').first();
            const selectedBeforeSwipe = await mobile.locator('button[data-selected="true"]').count();
            const swipeBox = await swipeArea.boundingBox();
            if (!swipeBox) throw new Error('Swipe area has no bounds');
            await mobile.mouse.move(swipeBox.x + swipeBox.width * 0.78, swipeBox.y + swipeBox.height / 2);
            await mobile.mouse.down();
            await mobile.mouse.move(swipeBox.x + swipeBox.width * 0.18, swipeBox.y + swipeBox.height / 2, { steps: 8 });
            await mobile.mouse.up();
            await mobile.waitForTimeout(150);
            if ((await mobile.locator('[data-mobile-day-index]').getAttribute('data-mobile-day-index')) !== '1') throw new Error('Dedicated swipe area did not change to next day');
            if (await mobile.locator('[data-date-header]').count() !== 1) throw new Error('Mobile next day rendered multiple dates');
            if (await mobile.locator('button[data-selected="true"]').count() !== selectedBeforeSwipe) throw new Error('Day swipe accidentally edited a tile');

            await viewButton.click();
            if ((await viewButton.getAttribute('aria-pressed')) !== 'true') throw new Error('View mode toggle failed');
            const viewCell = mobile.locator('button[data-slot-start]').first();
            const pressedBeforeViewTap = await viewCell.getAttribute('aria-pressed');
            await viewCell.tap();
            await mobile.locator('[data-heatmap-tooltip="true"]').waitFor({ state: 'visible' });
            if ((await viewCell.getAttribute('aria-pressed')) !== pressedBeforeViewTap) throw new Error('View-mode tap changed availability');
            await mobile.screenshot({ path: `${screens}/mobile-view-inspect.png`, fullPage: true });

            await editButton.click();
            const holdCell = mobile.locator('button[data-slot-start]').nth(1);
            const holdBox = await holdCell.boundingBox();
            if (!holdBox) throw new Error('Hold test cell missing');
            const pressedBeforeHold = await holdCell.getAttribute('aria-pressed');
            await holdCell.dispatchEvent('pointerdown', { pointerType: 'touch', pointerId: 91, button: 0, clientX: holdBox.x + holdBox.width / 2, clientY: holdBox.y + holdBox.height / 2 });
            await mobile.waitForTimeout(520);
            await mobile.locator('[data-heatmap-tooltip="true"]').waitFor({ state: 'visible' });
            await holdCell.dispatchEvent('pointerup', { pointerType: 'touch', pointerId: 91, button: 0, clientX: holdBox.x + holdBox.width / 2, clientY: holdBox.y + holdBox.height / 2 });
            if ((await holdCell.getAttribute('aria-pressed')) !== pressedBeforeHold) throw new Error('Edit-mode hold changed availability');

            const mobileOrganizerContext = await browser.newContext({ viewport: { width: 390, height: 844 }, hasTouch: true, isMobile: true });
            const cookies = await organizerContext.cookies();
            await mobileOrganizerContext.addCookies(cookies);
            const mobileOrganizer = await mobileOrganizerContext.newPage();
            await mobileOrganizer.goto(`${base}/dashboard/meetings/${meeting.id}`);
            const mobileMatch = mobileOrganizer.locator('[data-match-start]').first();
            await mobileMatch.waitFor();
            const matchBox = await mobileMatch.boundingBox();
            if (!matchBox) throw new Error('Mobile match missing');
            await mobileMatch.dispatchEvent('pointerdown', { pointerType: 'touch', pointerId: 77, button: 0, clientX: matchBox.x + 20, clientY: matchBox.y + 20 });
            await mobileOrganizer.waitForTimeout(520);
            await mobileOrganizer.locator('[data-match-participant-names="true"]').waitFor({ state: 'visible' });
            await mobileMatch.dispatchEvent('pointerup', { pointerType: 'touch', pointerId: 77, button: 0, clientX: matchBox.x + 20, clientY: matchBox.y + 20 });
            await mobileOrganizer.screenshot({ path: `${screens}/mobile-match-hold.png`, fullPage: true });

            console.log('Unified heatmap browser validation passed.');
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node /tmp/validate-unified-heatmap.cjs

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: unified-heatmap-screenshots
          path: /tmp/unified-heatmap-screenshots/*.png
          if-no-files-found: error

      - name: Commit validated implementation
        run: |
          rm -f scripts/apply-unified-selectable-heatmap.py
          rm -f .github/workflows/unified-heatmap-validation.yml
          rm -f i18n-audit-output.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "unify availability selection with live heatmap"
          git push origin HEAD:agent/participant-guidance-quarter-ui
