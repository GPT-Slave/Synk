name: temp unified selection contour v3

on:
  push:
    branches:
      - agent/ui-readme-polish

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetplanner"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      JWT_SECRET: contour-access-secret-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: contour-refresh-secret-abcdefghijklmnopqrstuvwxyz
      CSRF_SECRET: contour-csrf-secret-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      BCRYPT_ROUNDS: "4"
      GLOBAL_RATE_LIMIT: "1000"
      GLOBAL_READ_RATE_LIMIT: "1000"
      GLOBAL_RATE_WINDOW_MS: "60000"
      TRUST_PROXY: "false"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-readme-polish
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Make contiguous selections use one contour
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/src/components/meetings/interactive-availability-heatmap.tsx')
          s = p.read_text(encoding='utf-8')

          anchor = '''              const selectedRight = Boolean(
                          active && rightCell && selected.has(rightCell.datetimeStart),
                        );
                        const dateLabel = formatDate(date.date, {'''
          replacement = '''              const selectedRight = Boolean(
                          active && rightCell && selected.has(rightCell.datetimeStart),
                        );
                        let selectedRunLength = 0;
                        if (active && !selectedLeft) {
                          for (let runIndex = quarterIndex; runIndex < 4; runIndex += 1) {
                            const runQuarter = runIndex * 15;
                            const runTime = `${hour.slice(0, 3)}${String(runQuarter).padStart(2, "0")}`;
                            const runCell = cellByGridPosition.get(`${date.date}:${runTime}`);
                            if (!runCell || !selected.has(runCell.datetimeStart)) break;
                            selectedRunLength += 1;
                          }
                        }
                        const dateLabel = formatDate(date.date, {'''
          if anchor not in s:
              raise SystemExit('selection-run anchor not found')
          s = s.replace(anchor, replacement, 1)

          old_render = '''                  {active && (
                              <FusedSelectionBoundary
                                hideLeft={selectedLeft}
                                hideRight={selectedRight}
                              />
                            )}'''
          new_render = '''                  {selectedRunLength > 0 && (
                              <FusedSelectionBoundary spanCount={selectedRunLength} />
                            )}'''
          if old_render not in s:
              raise SystemExit('boundary render anchor not found')
          s = s.replace(old_render, new_render, 1)

          start = s.index('function FusedSelectionBoundary({')
          end = s.index('function DaySwipeNavigator({', start)
          boundary = '''function FusedSelectionBoundary({ spanCount }: { spanCount: number }) {
            return (
              <span
                aria-hidden="true"
                data-selection-boundary="true"
                data-selection-span={spanCount}
                style={{
                  position: "absolute",
                  pointerEvents: "none",
                  zIndex: 20,
                  top: 3,
                  bottom: 3,
                  left: 3,
                  width: `calc(${spanCount * 100}% - 6px)`,
                  border: "1px solid rgba(21, 128, 61, 0.7)",
                  borderRadius: "0.55rem",
                  boxShadow: "inset 0 0 5px rgba(22, 163, 74, 0.08)",
                }}
              />
            );
          }

          '''
          s = s[:start] + boundary + s[end:]
          p.write_text(s, encoding='utf-8')
          PY

      - run: pnpm install --frozen-lockfile

      - name: Static validation
        run: |
          pnpm prisma:generate
          pnpm --filter api run db:migrate:deploy
          node scripts/i18n-audit.mjs
          pnpm --filter web lint
          pnpm --filter api lint
          pnpm --filter web typecheck
          pnpm --filter api typecheck
          ! grep -q 'Save now' apps/web/src/components/meetings/availability-grid.tsx
          grep -q 'data-cursor-halo="true"' apps/web/src/components/cursor-halo.tsx
          grep -q 'data-selection-span' apps/web/src/components/meetings/interactive-availability-heatmap.tsx

      - name: Start app
        run: |
          PORT=4000 pnpm --filter api start >/tmp/api.log 2>&1 &
          PORT=3000 pnpm --filter web exec next dev --webpack >/tmp/web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/ >/dev/null 2>&1 && curl -fsS http://localhost:3000/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/api.log || true
          cat /tmp/web.log || true
          exit 1

      - name: Install browser tools
        run: |
          mkdir -p /tmp/pw /tmp/contour-v3
          npm install --prefix /tmp/pw playwright@1.54.2
          node /tmp/pw/node_modules/playwright/cli.js install chromium

      - name: Validate unified contour and cursor
        run: |
          cat >/tmp/contour-v3.cjs <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const base = 'http://localhost:3000';
          const api = 'http://localhost:4000';
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await (await browser.newContext({ viewport: { width: 1440, height: 1000 } })).newPage();
            const password = 'ContourPass1!';
            await page.goto(`${base}/signup`);
            await page.locator('#email').fill(`contour-${Date.now()}@example.com`);
            await page.locator('#password').fill(password);
            await page.locator('#confirm-password').fill(password);
            await page.getByRole('button', { name: 'Create organizer account' }).click();
            await page.waitForURL('**/dashboard');

            await page.mouse.move(480, 330);
            await page.waitForTimeout(100);
            const halo = page.locator('[data-cursor-halo="true"]');
            if ((await halo.evaluate((el) => getComputedStyle(el).opacity)) === '0') throw new Error('cursor halo hidden');

            const meeting = await page.evaluate(async ({ api }) => {
              const csrf = await (await fetch(`${api}/auth/csrf`, { credentials: 'include' })).json();
              const r = await fetch(`${api}/meetings`, {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf.token },
                body: JSON.stringify({ title:'Contour v3', startDate:'2026-08-13', endDate:'2026-08-13', workdayStart:'08:00', workdayEnd:'10:00', slotIntervalMinutes:15, meetingDurationMinutes:30, timezone:'Africa/Tunis' })
              });
              if (!r.ok) throw new Error(await r.text());
              return r.json();
            }, { api });
            await page.goto(`${base}/dashboard/meetings/${meeting.id}`);
            if (await page.getByRole('button', { name: 'Save now' }).count()) throw new Error('Save now still exists');
            const a = page.locator('button[title^="08:00 ·"]').first();
            const b = page.locator('button[title^="08:15 ·"]').first();
            await a.click();
            await b.click();

            const contours = page.locator('[data-selection-boundary="true"]');
            if (await contours.count() !== 1) throw new Error(`expected one contour for contiguous run, got ${await contours.count()}`);
            const contour = contours.first();
            if ((await contour.getAttribute('data-selection-span')) !== '2') throw new Error('contour does not span both selected quarters');
            const style = await contour.evaluate((el) => {
              const s = getComputedStyle(el);
              return { radius: s.borderRadius, shadow: s.boxShadow, color: s.borderTopColor, width: s.width };
            });
            if (parseFloat(style.radius) < 6) throw new Error(`contour radius too small: ${style.radius}`);
            if (!style.shadow.includes('inset')) throw new Error('contour glow is not inset');
            if (style.shadow.split(',').length > 1) throw new Error(`contour has external/multiple glow: ${style.shadow}`);
            if (!style.color.includes('21') || !style.color.includes('128')) throw new Error(`green not dark enough: ${style.color}`);
            const aBox = await a.boundingBox();
            const bBox = await b.boundingBox();
            const contourBox = await contour.boundingBox();
            if (!aBox || !bBox || !contourBox) throw new Error('missing contour geometry');
            const selectedWidth = bBox.x + bBox.width - aBox.x;
            if (Math.abs(contourBox.width - (selectedWidth - 6)) > 3) throw new Error(`contour does not cover fused run: ${contourBox.width} vs ${selectedWidth}`);

            await page.screenshot({ path: '/tmp/contour-v3/desktop-contour-v3.png', fullPage: true });
            const union = { x: aBox.x - 16, y: aBox.y - 16, width: selectedWidth + 32, height: aBox.height + 32 };
            await page.screenshot({ path: '/tmp/contour-v3/selection-contour-v3.png', clip: union });
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node /tmp/contour-v3.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: selection-contour-v3-screenshots
          path: /tmp/contour-v3/*.png
          if-no-files-found: error

      - name: Commit contour and remove temporary workflow
        run: |
          rm .github/workflows/temp-selection-contour-v3.yml
          rm -f i18n-audit-output.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/meetings/interactive-availability-heatmap.tsx .github/workflows/temp-selection-contour-v3.yml
          git commit -m "unify selected heatmap contour"
          git push origin HEAD:agent/ui-readme-polish
