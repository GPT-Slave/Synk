name: temp meeting open diagnostic

on:
  push:
    branches:
      - agent/fix-meeting-open-regression

jobs:
  diagnose:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetplanner
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d meetplanner" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      JWT_SECRET: meeting-diagnostic-access-secret-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: meeting-diagnostic-refresh-secret-abcdefghijklmnopqrstuvwxyz
      CSRF_SECRET: meeting-diagnostic-csrf-secret-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      BCRYPT_ROUNDS: "4"
      GLOBAL_RATE_LIMIT: "1000"
      GLOBAL_READ_RATE_LIMIT: "1000"
      GLOBAL_RATE_WINDOW_MS: "60000"
      TRUST_PROXY: "false"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma:generate
      - run: pnpm --filter api run db:migrate:deploy
      - name: Start app
        run: |
          PORT=4000 pnpm --filter api start >/tmp/api.log 2>&1 &
          PORT=3000 pnpm --filter web exec next dev --webpack >/tmp/web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/ >/dev/null 2>&1 && curl -fsS http://localhost:3000/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/api.log || true
          cat /tmp/web.log || true
          exit 1
      - name: Install Chromium
        run: |
          mkdir -p /tmp/pw /tmp/meeting-diagnostic
          npm install --prefix /tmp/pw playwright@1.54.2
          node /tmp/pw/node_modules/playwright/cli.js install chromium
      - name: Open and reload organizer meeting
        run: node scripts/temp-meeting-open-diagnostic.cjs
      - name: Logs on failure
        if: failure()
        run: |
          echo '--- API LOG ---'
          cat /tmp/api.log || true
          echo '--- WEB LOG ---'
          cat /tmp/web.log || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: meeting-open-diagnostic
          path: /tmp/meeting-diagnostic/*.png
          if-no-files-found: ignore
