name: temp ui readme polish v2

on:
  push:
    branches:
      - agent/ui-readme-polish

permissions:
  contents: write

jobs:
  polish-and-validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: meetplanner
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d meetplanner"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/meetplanner?schema=public
      JWT_SECRET: ui-polish-access-secret-abcdefghijklmnopqrstuvwxyz
      JWT_REFRESH_SECRET: ui-polish-refresh-secret-abcdefghijklmnopqrstuvwxyz
      CSRF_SECRET: ui-polish-csrf-secret-abcdefghijklmnopqrstuvwxyz
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      CORS_ORIGIN: http://localhost:3000
      COOKIE_SECURE: "false"
      BCRYPT_ROUNDS: "4"
      GLOBAL_RATE_LIMIT: "1000"
      GLOBAL_READ_RATE_LIMIT: "1000"
      GLOBAL_RATE_WINDOW_MS: "60000"
      TRUST_PROXY: "false"
      NEXT_PUBLIC_API_URL: http://localhost:4000
      NEXT_PUBLIC_WS_URL: ws://localhost:4000

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ui-readme-polish
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Apply requested polish
        run: |
          python3 - <<'PY'
          from pathlib import Path

          heatmap_path = Path('apps/web/src/components/meetings/interactive-availability-heatmap.tsx')
          heatmap = heatmap_path.read_text(encoding='utf-8')
          start = heatmap.index('function FusedSelectionBoundary({')
          end = heatmap.index('function DaySwipeNavigator({', start)
          heatmap = heatmap[:start] + '''function FusedSelectionBoundary({
            hideLeft,
            hideRight,
          }: {
            hideLeft: boolean;
            hideRight: boolean;
          }) {
            return (
              <span
                aria-hidden="true"
                data-selection-boundary="true"
                style={{
                  position: "absolute",
                  pointerEvents: "none",
                  zIndex: 20,
                  top: 3,
                  bottom: 3,
                  left: hideLeft ? -1 : 3,
                  right: hideRight ? -1 : 3,
                  borderStyle: "solid",
                  borderWidth: 1,
                  borderLeftWidth: hideLeft ? 0 : 1,
                  borderRightWidth: hideRight ? 0 : 1,
                  borderColor: "rgba(22, 163, 74, 0.72)",
                  borderTopLeftRadius: hideLeft ? 0 : "0.55rem",
                  borderBottomLeftRadius: hideLeft ? 0 : "0.55rem",
                  borderTopRightRadius: hideRight ? 0 : "0.55rem",
                  borderBottomRightRadius: hideRight ? 0 : "0.55rem",
                  boxShadow:
                    "inset 0 0 8px rgba(16, 185, 129, 0.12), 0 0 3px rgba(5, 120, 87, 0.1)",
                }}
              />
            );
          }

          ''' + heatmap[end:]
          heatmap_path.write_text(heatmap, encoding='utf-8')

          availability_path = Path('apps/web/src/components/meetings/availability-grid.tsx')
          availability = availability_path.read_text(encoding='utf-8')
          availability = availability.replace('  Save,\n', '')
          availability = availability.replace('import { useToast } from "@/components/ui/toast";\n', '')
          availability = availability.replace('  const toast = useToast();\n', '')
          old_controls = '''        <div className="flex flex-wrap items-center gap-3">
                    <SaveIndicator state={saveState} />
                    <Button
                      disabled={!meeting.acceptingResponses || mutation.isPending}
                      onClick={() =>
                        saveResponse(response, {
                          onSuccess: () =>
                            toast({
                              title: t("Availability saved"),
                              description: t("Your latest times and note are safely stored."),
                              variant: "success",
                            }),
                        })
                      }
                      type="button"
                    >
                      {saveState === "saving" ? (
                        <LoaderCircle className="animate-spin" />
                      ) : (
                        <Save />
                      )}
                      {t("Save now")}
                    </Button>
                  </div>'''
          if old_controls not in availability:
              raise SystemExit('Save-now control block not found')
          availability = availability.replace(
              old_controls,
              '        <div className="flex items-center">\n          <SaveIndicator state={saveState} />\n        </div>'
          )
          availability_path.write_text(availability, encoding='utf-8')

          Path('apps/web/src/components/cursor-halo.tsx').write_text('''"use client";

          import { useEffect, useRef } from "react";

          const HALO_SIZE = 72;

          export function CursorHalo() {
            const haloRef = useRef<HTMLDivElement | null>(null);

            useEffect(() => {
              const halo = haloRef.current;
              if (!halo) return;

              let frame = 0;
              let x = -HALO_SIZE;
              let y = -HALO_SIZE;

              const paint = () => {
                frame = 0;
                halo.style.transform = `translate3d(${x - HALO_SIZE / 2}px, ${y - HALO_SIZE / 2}px, 0)`;
              };
              const move = (event: PointerEvent) => {
                if (event.pointerType !== "mouse") {
                  halo.style.opacity = "0";
                  return;
                }
                x = event.clientX;
                y = event.clientY;
                halo.style.opacity = "1";
                if (!frame) frame = window.requestAnimationFrame(paint);
              };
              const hide = () => {
                halo.style.opacity = "0";
              };

              window.addEventListener("pointermove", move, { passive: true });
              document.documentElement.addEventListener("pointerleave", hide);
              window.addEventListener("blur", hide);
              return () => {
                if (frame) window.cancelAnimationFrame(frame);
                window.removeEventListener("pointermove", move);
                document.documentElement.removeEventListener("pointerleave", hide);
                window.removeEventListener("blur", hide);
              };
            }, []);

            return (
              <div
                aria-hidden="true"
                className="pointer-events-none fixed left-0 top-0 z-[9999] size-[72px] rounded-full opacity-0 transition-opacity duration-150 [background:radial-gradient(circle,rgba(96,165,250,0.22)_0%,rgba(56,189,248,0.09)_38%,transparent_72%)] blur-[5px] mix-blend-screen will-change-transform"
                data-cursor-halo="true"
                ref={haloRef}
              />
            );
          }
          '''.replace('\n          ', '\n').lstrip(), encoding='utf-8')

          layout_path = Path('apps/web/src/app/layout.tsx')
          layout = layout_path.read_text(encoding='utf-8')
          layout = layout.replace(
              'import { QueryProvider } from "@/components/query-provider";\n',
              'import { QueryProvider } from "@/components/query-provider";\nimport { CursorHalo } from "@/components/cursor-halo";\n'
          )
          layout = layout.replace(
              '          <QueryProvider>{children}</QueryProvider>\n          <ThemeToggle />',
              '          <QueryProvider>{children}</QueryProvider>\n          <CursorHalo />\n          <ThemeToggle />'
          )
          layout_path.write_text(layout, encoding='utf-8')

          readme = '''<div align="center">
            <img src="./apps/web/public/logo_nobg.png" alt="Synk logo" width="104" />

            # Synk

            **Find time. Together.**

            A lightweight meeting planner for collecting availability, seeing overlap live, and choosing the best time without requiring participant accounts.

            ![Next.js](https://img.shields.io/badge/Next.js-16-000000?logo=nextdotjs)
            ![NestJS](https://img.shields.io/badge/NestJS-11-E0234E?logo=nestjs)
            ![PostgreSQL](https://img.shields.io/badge/PostgreSQL-16-4169E1?logo=postgresql&logoColor=white)
            ![TypeScript](https://img.shields.io/badge/TypeScript-5-3178C6?logo=typescript&logoColor=white)
          </div>

          ## What Synk does

          1. An organizer creates a date range, working hours, and meeting duration.
          2. Synk creates a private invitation link.
          3. Participants enter a display name and mark the 15-minute slots that work for them.
          4. Availability updates into a shared heatmap and ranked best-time suggestions.
          5. The organizer confirms the final meeting time.

          Participants do not need accounts. A participant can reuse the same name on another device to reopen their saved response, while organizer accounts keep meeting creation and management private.

          ## Highlights

          - Unified editable availability heatmap with optimistic updates.
          - Realtime changes through Socket.IO.
          - Best-time suggestions across the full requested meeting duration.
          - Mobile one-day navigation and touch-friendly editing/inspection.
          - Organizer locking, reopening, editing, participant removal, and finalization.
          - Dark/light themes, RTL support, PWA support, and 12 interface languages.
          - Autosave with throttling, retry backoff, and per-device participant sessions.

          ## Architecture

          ```mermaid
          flowchart LR
              O[Organizer] --> W[Next.js web]
              P[Participant] --> W

              subgraph Backend[NestJS backend]
                A[REST + auth]
                R[Socket.IO gateway]
                S[Meeting & availability services]
              end

              W -->|REST / secure cookies| A
              W <-->|realtime events| R
              A --> S
              R --> S
              S -->|Prisma| D[(PostgreSQL)]

              T[shared-types] -. TypeScript contracts .-> W
              T -. TypeScript contracts .-> A
              T -. TypeScript contracts .-> R
          ```

          `shared-types` is a compile-time contract package; it is not a separate runtime service.

          ## Stack

          | Area | Technology |
          | --- | --- |
          | Web | Next.js 16, React 19, TypeScript, Tailwind CSS |
          | Client data | TanStack Query, Socket.IO client |
          | API | NestJS 11, REST, Socket.IO |
          | Database | PostgreSQL 16+, Prisma |
          | Workspace | pnpm monorepo + shared TypeScript contracts |

          ## Run locally

          Requirements: **Node.js 22**, **pnpm 10.15**, and **PostgreSQL 16+**.

          On Windows, the shortest path is:

          ```powershell
          corepack enable
          pnpm install
          Copy-Item apps\\api\\.env.example apps\\api\\.env
          pnpm synk
          ```

          Synk starts the web app at `http://localhost:3000` and the API at `http://localhost:4000`.

          For a manual start:

          ```powershell
          pnpm install
          pnpm prisma:generate
          pnpm prisma:migrate
          pnpm dev:api
          ```

          Then, in another terminal:

          ```powershell
          pnpm dev:web
          ```

          ## Repository

          ```text
          apps/web/             Next.js frontend and PWA
          apps/api/             NestJS API, Prisma schema, migrations, realtime gateway
          packages/shared-types Shared contracts used by web and API
          scripts/              Local launcher, load tests, and security checks
          ```

          ## Useful commands

          | Command | Purpose |
          | --- | --- |
          | `pnpm synk` | Prepare and launch the local stack on Windows |
          | `pnpm build` | Build web and API |
          | `pnpm lint` | Lint web and API |
          | `pnpm performance:load` | Run the meeting load scenario |
          | `pnpm security:audit` | Run the security audit script |

          ## Security notes

          - Organizer sessions use short-lived access tokens and rotating refresh tokens in HTTP-only cookies.
          - Mutating requests use signed CSRF protection and explicit CORS origins.
          - Participant sessions are scoped to a meeting invitation and device session.

          ---

          Synk is built around one simple flow: **share a link, collect availability, choose a time.**
          '''
          Path('README.md').write_text(readme.replace('\n          ', '\n').lstrip(), encoding='utf-8')
          PY

      - run: pnpm install --frozen-lockfile

      - name: Static validation
        run: |
          pnpm prisma:generate
          pnpm --filter api run db:migrate:deploy
          node scripts/i18n-audit.mjs
          pnpm --filter web lint
          pnpm --filter api lint
          pnpm --filter web typecheck
          pnpm --filter api typecheck
          grep -q 'data-selection-boundary="true"' apps/web/src/components/meetings/interactive-availability-heatmap.tsx
          grep -q 'data-cursor-halo="true"' apps/web/src/components/cursor-halo.tsx
          ! grep -q 'Save now' apps/web/src/components/meetings/availability-grid.tsx
          grep -q 'shared-types.*compile-time contract' README.md
          ! grep -q 'Deployment matrix' README.md

      - name: Start app
        run: |
          PORT=4000 pnpm --filter api start >/tmp/api.log 2>&1 &
          PORT=3000 pnpm --filter web exec next dev --webpack >/tmp/web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:4000/ >/dev/null 2>&1 && curl -fsS http://localhost:3000/ >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          cat /tmp/api.log || true
          cat /tmp/web.log || true
          exit 1

      - name: Install browser tools
        run: |
          mkdir -p /tmp/pw /tmp/ui-polish
          npm install --prefix /tmp/pw playwright@1.54.2
          node /tmp/pw/node_modules/playwright/cli.js install chromium

      - name: Browser validation
        run: |
          cat >/tmp/ui-polish.cjs <<'NODE'
          const { chromium } = require('/tmp/pw/node_modules/playwright');
          const base = 'http://localhost:3000';
          const api = 'http://localhost:4000';
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await (await browser.newContext({ viewport: { width: 1440, height: 1000 } })).newPage();
            const password = 'UiPolishPass1!';
            await page.goto(`${base}/signup`);
            await page.locator('#email').fill(`ui-polish-${Date.now()}@example.com`);
            await page.locator('#password').fill(password);
            await page.locator('#confirm-password').fill(password);
            await page.getByRole('button', { name: 'Create organizer account' }).click();
            await page.waitForURL('**/dashboard');

            const halo = page.locator('[data-cursor-halo="true"]');
            await page.mouse.move(420, 320);
            await page.waitForTimeout(100);
            const haloState = await halo.evaluate((el) => ({
              opacity: getComputedStyle(el).opacity,
              pointerEvents: getComputedStyle(el).pointerEvents,
              background: getComputedStyle(el).backgroundImage,
              rect: el.getBoundingClientRect().toJSON(),
            }));
            if (haloState.opacity === '0') throw new Error('cursor halo did not appear');
            if (haloState.pointerEvents !== 'none') throw new Error('cursor halo captures pointer events');
            if (!haloState.background.includes('radial-gradient')) throw new Error('cursor halo lost radial blur');
            const centerX = haloState.rect.x + haloState.rect.width / 2;
            const centerY = haloState.rect.y + haloState.rect.height / 2;
            if (Math.abs(centerX - 420) > 3 || Math.abs(centerY - 320) > 3) throw new Error(`cursor halo does not track pointer: ${centerX},${centerY}`);

            const meeting = await page.evaluate(async ({ api }) => {
              const csrf = await (await fetch(`${api}/auth/csrf`, { credentials: 'include' })).json();
              const r = await fetch(`${api}/meetings`, {
                method: 'POST', credentials: 'include',
                headers: { 'Content-Type': 'application/json', 'X-CSRF-Token': csrf.token },
                body: JSON.stringify({ title:'UI polish validation', startDate:'2026-08-13', endDate:'2026-08-13', workdayStart:'08:00', workdayEnd:'10:00', slotIntervalMinutes:15, meetingDurationMinutes:30, timezone:'Africa/Tunis' })
              });
              if (!r.ok) throw new Error(await r.text());
              return r.json();
            }, { api });

            await page.goto(`${base}/dashboard/meetings/${meeting.id}`);
            if (await page.getByRole('button', { name: 'Save now' }).count()) throw new Error('Save now button still exists');
            const a = page.locator('button[title^="08:00 ·"]').first();
            const b = page.locator('button[title^="08:15 ·"]').first();
            await a.click();
            await b.click();
            const boundaries = page.locator('[data-selection-boundary="true"]');
            if (await boundaries.count() !== 2) throw new Error(`expected one selection contour per selected tile, got ${await boundaries.count()}`);
            const style = await boundaries.first().evaluate((el) => {
              const s = getComputedStyle(el);
              return {
                borderColor: s.borderTopColor,
                radius: s.borderTopLeftRadius,
                shadow: s.boxShadow,
                rightWidth: s.borderRightWidth,
              };
            });
            if (!style.borderColor.includes('22') || !style.borderColor.includes('163')) throw new Error(`selection green is not the intended darker tone: ${style.borderColor}`);
            if (parseFloat(style.radius) < 6) throw new Error(`selection contour is not rounded: ${style.radius}`);
            if (!style.shadow.includes('inset')) throw new Error(`selection glow is not inset: ${style.shadow}`);
            if (style.rightWidth !== '0px') throw new Error('adjacent selected cells still draw an internal boundary');

            await page.screenshot({ path: '/tmp/ui-polish/desktop-ui-polish.png', fullPage: true });
            await a.screenshot({ path: '/tmp/ui-polish/selected-rounded-tile.png' });
            await browser.close();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          node /tmp/ui-polish.cjs

      - uses: actions/upload-artifact@v4
        with:
          name: ui-readme-polish-screenshots
          path: /tmp/ui-polish/*.png
          if-no-files-found: error

      - name: Commit validated changes and remove temporary workflow
        run: |
          rm .github/workflows/temp-ui-readme-polish-v2.yml
          rm -f i18n-audit-output.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md apps/web/src/app/layout.tsx apps/web/src/components/cursor-halo.tsx apps/web/src/components/meetings/availability-grid.tsx apps/web/src/components/meetings/interactive-availability-heatmap.tsx .github/workflows/temp-ui-readme-polish-v2.yml
          git commit -m "polish heatmap selection cursor and readme"
          git push origin HEAD:agent/ui-readme-polish
