services:
  db:
    image: postgres:16-alpine
    container_name: calendra-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meetplanner
    ports:
      - "5432:5432"
    volumes:
      - calendra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetplanner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  calendra_pgdata:
